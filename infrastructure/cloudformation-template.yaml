AWSTemplateFormatVersion: '2010-09-09'
Description: Lambda API Data Fetcher with DynamoDB Cache and 3-day TTL
Parameters:
  ApiKey:
    Type: String
    Description: API Key for external API
    NoEcho: true
  ApiEndpoint:
    Type: String
    Description: External API endpoint URL
  LambdaDeploymentBucket:
    Type: String
    Description: S3 bucket containing Lambda release ZIPs
  LambdaDeploymentKey:
    Type: String
    Description: Immutable S3 release key
  LambdaDeploymentCodeSha256:
    Type: String
    Description: Base64 SHA256 of the deployed Lambda ZIP
  DataSfToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: Optional DataSF app token
Resources:
  ApiDataCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ApiDataCache
      AttributeDefinitions:
      - AttributeName: data_id
        AttributeType: S
      KeySchema:
      - AttributeName: data_id
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
      - Key: Environment
        Value: Production
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: DynamoDBAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Scan
            - dynamodb:Query
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            Resource:
              Fn::GetAtt:
              - ApiDataCacheTable
              - Arn
      - PolicyName: S3Access
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - s3:PutObject
            - s3:GetObject
            - s3:ListBucket
            Resource:
            - Fn::GetAtt:
              - CrimeDataBackupBucket
              - Arn
            - Fn::Sub: ${CrimeDataBackupBucket.Arn}/*
  ApiDataFetcherLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: ApiDataFetcher
      Runtime: python3.11
      Handler: lambda_fetch_api.lambda_handler
      Code:
        S3Bucket:
          Ref: LambdaDeploymentBucket
        S3Key:
          Ref: LambdaDeploymentKey
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME:
            Ref: ApiDataCacheTable
          API_KEY:
            Ref: ApiKey
          API_ENDPOINT:
            Ref: ApiEndpoint
          S3_BUCKET_NAME:
            Ref: CrimeDataBackupBucket
          SAFETY_CACHE_MAX_AGE_SECONDS: '300'
          DATASF_API_KEY:
            Ref: DataSfToken
      Tags:
      - Key: Environment
        Value: Production
    Metadata:
      SafePathCodeSha256:
        Ref: LambdaDeploymentCodeSha256
  ApiGateway:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: ApiDataFetcherAPI
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowMethods:
        - GET
        - POST
        - OPTIONS
        AllowHeaders:
        - '*'
  ApiGatewayLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: ApiDataFetcherLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/*/*
  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: ApiGateway
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiDataFetcherLambda.Arn}/invocations
      PayloadFormatVersion: '2.0'
  FetchNewRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: ApiGateway
      RouteKey: POST /fetch-new
      Target:
        Fn::Sub: integrations/${LambdaIntegration}
  GetDataRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: ApiGateway
      RouteKey: GET /data
      Target:
        Fn::Sub: integrations/${LambdaIntegration}
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId:
        Ref: ApiGateway
      StageName: prod
      AutoDeploy: true
  ScheduledFetchRule:
    Type: AWS::Events::Rule
    Properties:
      Name: ApiDataFetcherSchedule
      Description: Trigger Lambda to fetch new API data every hour
      ScheduleExpression: rate(1 hour)
      State: ENABLED
      Targets:
      - Arn:
          Fn::GetAtt: ApiDataFetcherLambda.Arn
        Id: '1'
        Input: '{"httpMethod": "POST", "path": "/fetch-new"}'
  ScheduledFetchLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: ApiDataFetcherLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn:
        Fn::GetAtt: ScheduledFetchRule.Arn
  ScoreRoutesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: ApiGateway
      RouteKey: POST /score-routes
      Target:
        Fn::Sub: integrations/${LambdaIntegration}
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  SafetyDataRefreshRule:
    Type: AWS::Events::Rule
    Properties:
      Name: SafePathSafetyDataRefresh
      Description: Refresh SafePath incident snapshots every five minutes
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      EventBusName: default
      Targets:
      - Id: SafetySnapshotRefresh
        Arn:
          Fn::GetAtt:
          - ApiDataFetcherLambda
          - Arn
        Input: '{"action": "refresh-safety-data"}'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  SafetyDataRefreshPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: ApiDataFetcherLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn:
        Fn::GetAtt:
        - SafetyDataRefreshRule
        - Arn
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  CrimeDataBackupBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: safepath-crime-data-${AWS::AccountId}
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod
  DynamoDBTableName:
    Description: Name of the DynamoDB table
    Value:
      Ref: ApiDataCacheTable
  LambdaFunctionArn:
    Description: ARN of the Lambda function
    Value:
      Fn::GetAtt: ApiDataFetcherLambda.Arn
