name: Weekly dashboard refresh

on:
  schedule:
    - cron: '0 9 * * 1'
      timezone: America/Los_Angeles
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/weekly-dashboard-refresh.yml
      - scripts/export_tableau_data.py
      - scripts/verify_dashboard_publication.py
      - scripts/tests/test_dispatch_download.py

permissions:
  contents: write

concurrency:
  group: weekly-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install export dependencies
        run: python -m pip install requests==2.32.3
      - name: Test snapshot validation
        run: python -m unittest discover -s scripts/tests -p test_dispatch_download.py
      - name: Validate and download the latest 72-hour AWS dispatch snapshot
        run: python scripts/export_tableau_data.py
      - name: Build before publishing
        env:
          REACT_APP_API_ENDPOINT: https://scdwndv5z4.execute-api.us-east-1.amazonaws.com/prod
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit only validated snapshot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/tableau/sf-crime-incidents.csv public/tableau/manifest.json public/safety-analytics.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh weekly dispatch dashboard snapshot'
            git push origin HEAD:main
          fi
      - name: Verify Vercel published the matching snapshot
        run: python scripts/verify_dashboard_publication.py --timeout 900
